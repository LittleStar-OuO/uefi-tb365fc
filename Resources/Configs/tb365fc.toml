#
# Lenovo TB365FC (MediaTek MT6835), 8 GiB, UFS 2.2.
#
# Boot image layout of Android 15 / ZUXOS 1.1.10.122, read back from the
# stock vendor_boot.img:
#
#   vendor_boot v4 header: kernel_addr 0x40000000, ramdisk_addr 0x66F00000,
#   tags_addr 0x47C80000, cmdline "bootopt=64S3,32N2,64N2".
#
# LK decompresses the boot image kernel to kernel_addr and jumps there, so
# the UEFI FD (whose first bytes branch to the SEC entry) is packaged as a
# compressed v4 kernel with no ramdisk. init_boot and vendor_boot stay
# stock: LK loads their ramdisks to 0x66F00000 and the DTB to the tags
# address. No Boot Shim is needed because kernel_addr is the FD base.
#
# The FD window lies at the start of the LK kernel mblock
# (0x40000000-0x47C80000) and must match tb365fc.dsc (stack at 0x41400000,
# above the 16 MiB payload window) and MemoryMapLib. The boot image kernel is
# gzip(FD || UniXNU payload): LK decompresses both to 0x40000000.
#

#
# UEFI FD Configs
#
[uefi_fd]
base = 0x40000000
size = 0x00400000

#
# Android Boot Image Kernel Configs
#
[boot_image_kernel]
kernel_compression = "gzip"
append_dtb         = false
mtk_header         = false

#
# Android Boot Image Configs
#
[boot_image]
header_version = 4
